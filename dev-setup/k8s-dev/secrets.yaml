# Dev-only credentials. Never reuse these anywhere real.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
type: Opaque
stringData:
  POSTGRES_USER: dev
  POSTGRES_PASSWORD: dev
  POSTGRES_DB: appdb
---
apiVersion: v1
kind: Secret
metadata:
  name: rustfs-credentials
type: Opaque
stringData:
  RUSTFS_ACCESS_KEY: rustfsadmin
  RUSTFS_SECRET_KEY: rustfsadmin
