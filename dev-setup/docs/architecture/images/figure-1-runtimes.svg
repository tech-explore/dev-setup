<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 404" width="760" height="404" font-family="FreeSans, 'DejaVu Sans', sans-serif" role="img" aria-label="Everything runs on one machine, split across three runtimes"><rect width="760" height="404" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#b9b7aa"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker></defs><text x="24" y="28" font-size="15" font-weight="bold" text-anchor="start" fill="#1f2937">Everything runs on one machine, split across three runtimes</text><rect x="24" y="48" width="712" height="316" rx="8" fill="none" stroke="#b9b7aa" stroke-width="1.25"/><text x="40" y="72" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937">Windows 11 host</text><rect x="40" y="88" width="216" height="88" rx="8" fill="none" stroke="#b9b7aa" stroke-width="1.25"/><text x="56" y="112" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937">Windows apps</text><text x="56" y="128" font-size="11.5" text-anchor="start" fill="#1f2937">IntelliJ / Eclipse, JDK 21</text><text x="56" y="144" font-size="11.5" text-anchor="start" fill="#1f2937">Java backend on :8080</text><text x="56" y="160" font-size="11.5" text-anchor="start" fill="#1f2937">VS Code window and browser</text><rect x="40" y="192" width="216" height="88" rx="8" fill="none" stroke="#b9b7aa" stroke-width="1.25"/><text x="56" y="216" font-size="13" font-weight="bold" text-anchor="start" fill="#1f2937">WSL2: Ubuntu</text><text x="56" y="232" font-size="11.5" text-anchor="start" fill="#1f2937">Node (fnm) and Git</text><text x="56" y="248" font-size="11.5" text-anchor="start" fill="#1f2937">Next.js dev server on :3000</text><text x="56" y="264" font-size="11.5" text-anchor="start" fill="#1f29